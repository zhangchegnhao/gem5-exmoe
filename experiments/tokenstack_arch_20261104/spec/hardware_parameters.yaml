# Prospective H1 input only. Do not pass these records directly to Ramulator.
profiles:
  fig3_binary_geometry_assumption_v1:
    class: engineering_assumption
    status: capacity_consistent_runtime_supported_engineering
    runtime_supported: true
    source: [fig3, attacc_config, mapper, contract]
    decisions: [Q1_figure_bank_counts_only, Q2_figure_binary_units, Q3_attacc_16ch_2pc_assumed]
    stacks: 1
    capacity_dies: 4
    compute_dies: 4
    dq_bits: 32
    prefetch: 8
    # No inherited 2-rank stack repeated inside each physical die.
    # Rows derived from exact per-die byte targets and selected bank counts.
    capacity_geometry: [16, 2, 1, 4, 4, 4096, 32]
    compute_geometry: [16, 2, 1, 4, 2, 4096, 32]
    capacity_die_bytes: 2147483648
    compute_die_bytes: 1073741824
    # H1 explicit conservative reuse, not a measured 512/1024 Mib die timing.
    refresh_timing: {nRFC: 456, nREFISB: 159, nREFI: 5070, source: config/tokenstack_hardware.yaml, class: engineering_assumption}
    tsv_policy: one_aggregate_budget_both_hops
    ucie_policy: separate_stack_port_budget
  table2_decimal_capacity_alternative_v1:
    class: engineering_assumption
    status: unit_alternative_no_geometry
    runtime_supported: false
    source: [table2, contract]
    capacity_die_bytes: 2000000000
    compute_die_bytes: 1000000000
    geometry: null  # Do not force non-power-of-two capacity into the existing bit-slice mapper.

